# One repo for every platform: Shared/ (both apps compile it), tvOS/, macOS/, Tests/. iOS comes later (stub below).
name: NexusTV
options:
  bundleIdPrefix: com.nexus
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "11"
targets:
  NexusTV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: tvOS
    dependencies:
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
    postBuildScripts:
      - name: No account or catalogue inside the app
        basedOnDependencyAnalysis: false
        script: |
          # Earlier builds bundled a login (DefaultAccount.plist) and a catalogue file (search_all.json).
          # An incremental build keeps resources that were removed from the project, so remove them from the product.
          APP="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          for f in DefaultAccount.plist search_all.json; do
            if [ -e "$APP/$f" ]; then rm "$APP/$f"; echo "warning: removed a stale $f from the app"; fi
          done
    scheme:
      testTargets:
        - NexusTVUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.tv
        PRODUCT_NAME: Nexus TV
        PRODUCT_MODULE_NAME: NexusTV
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: tvOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Nexus TV
        CFBundleName: Nexus TV
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:              # black, like the opening's first frame (the opening follows at once)
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: false
  NexusTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Tests/tvOSUITests
    dependencies:
      - target: NexusTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NexusTV
  NexusTVMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: true
    scheme:
      testTargets:
        - NexusTVMacTests
        - NexusTVMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.tv.mac
        PRODUCT_NAME: Nexus TV
        PRODUCT_MODULE_NAME: NexusTVMac
        INFOPLIST_FILE: macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Nexus TV
        CFBundleName: Nexus TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  NexusTVMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/macOSUITests
    dependencies:
      - target: NexusTVMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.tv.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NexusTVMac
  NexusTVMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/macOSTests
    dependencies:
      - target: NexusTVMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.tv.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nexus TV.app/Contents/MacOS/Nexus TV"
        BUNDLE_LOADER: "$(TEST_HOST)"
